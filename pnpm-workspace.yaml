# Advisories are pinned here rather than by upgrading the direct dependency, because
# every root is dev tooling (vitepress, vitepress-plugin-llms, mermaid) that is already
# at its latest release. Each target below was checked to be published and to stay
# inside the major already installed.
#
# NOT pinned, deliberately -- `vite` (1 high, 2 moderate: GHSA-fx2h-pf6j-xcff,
# GHSA-4w7w-66w2-5vf9, GHSA-v6wh-96g9-6wx3) and `esbuild` (1 moderate: GHSA-67mh-4wv8-2f99):
#   * the fixes need vite >= 6.4.3 and esbuild >= 0.24.3, but vitepress 1.6.4 -- the
#     latest stable -- declares `vite ^5.4.14`, and vite 5 declares `esbuild ^0.21.3`.
#     vitepress 2.x is alpha only, so neither is reachable without leaving the
#     supported combination.
#   * forcing esbuild anyway was tried and breaks the build outright: vite 5 relies on
#     syntax lowering that esbuild 0.28 removed ("Transforming destructuring to the
#     configured target environment is not supported").
#   * all four advisories are **dev-server** issues -- `server.fs.deny` bypass on
#     Windows, `.map` path traversal, NTLM hash disclosure through the Windows
#     open-in-editor UNC path handling, and "any website can send requests to the
#     development server". This site is built statically (`vitepress build`) in CI and
#     served by GitHub Pages; the dev server only ever runs on a contributor's machine.
# Revisit when vitepress 2 is stable.
overrides:
  'lodash-es@<=4.17.23': '>=4.18.0'
  'rollup@>=4.0.0 <4.59.0': '4.59.0'
  'minimatch@>=10.0.0 <10.2.3': '10.2.3'
  'brace-expansion@>=4.0.0 <5.0.12': '5.0.12'
  'dompurify@<3.4.16': '3.4.16'
  'js-yaml@>=3.0.0 <3.15.2': '3.15.2'
  'linkify-it@<5.0.2': '5.0.2'
  'markdown-it@>=14.0.0 <14.3.1': '14.3.1'
  'nanoid@>=3.0.0 <3.3.18': '3.3.18'
  'postcss@<8.5.25': '8.5.25'

allowBuilds:
  esbuild: true
