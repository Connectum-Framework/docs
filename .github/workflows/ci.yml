name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test catalog learning model
        run: pnpm catalog:test

      - name: Test and typecheck service builder
        run: |
          pnpm builder:test
          pnpm builder:typecheck

      - name: Test overview boundaries and preserved guide content
        run: pnpm guide:test

      - name: Check canonical navigation and compatibility routes
        run: |
          pnpm docs:routes:check
          pnpm navigation:typecheck

      - name: Check Quickstart sources, recorded provenance and types
        run: |
          pnpm quickstart:generate
          git diff --exit-code -- .vitepress/quickstart/project-provenance.json
          pnpm quickstart:test
          pnpm quickstart:typecheck

      - name: Check homepage walkthroughs and generation
        run: |
          pnpm homepage:generate
          git diff --exit-code -- .vitepress/homepage/native.json .vitepress/homepage/provenance.json
          pnpm homepage:test
          pnpm homepage:typecheck

      - name: Test homepage HTTP/2 fixture
        run: |
          pnpm --dir .vitepress/homepage/example install --frozen-lockfile
          pnpm --dir .vitepress/homepage/example generate
          pnpm --dir .vitepress/homepage/example typecheck
          pnpm --dir .vitepress/homepage/example test

      - name: Check validation descriptor generation
        run: |
          pnpm validation:generate
          git diff --exit-code -- .vitepress/validation/gen

      - name: Typecheck validation showcase
        run: pnpm validation:typecheck

      - name: Check interceptor descriptor generation and types
        run: |
          pnpm interceptors:generate
          git diff --exit-code -- .vitepress/interceptors/gen
          pnpm interceptors:typecheck

      - name: Check OpenAPI descriptors and showcase types
        run: |
          pnpm openapi:generate
          pnpm openapi:reader
          git diff --exit-code -- .vitepress/openapi/gen .vitepress/openapi/generated
          pnpm openapi:typecheck

      - name: Test interceptor HTTP parity
        run: |
          pnpm --dir .vitepress/interceptors/example install --frozen-lockfile
          pnpm --dir .vitepress/interceptors/example generate
          pnpm --dir .vitepress/interceptors/example typecheck
          pnpm --dir .vitepress/interceptors/example test

      - name: Test validation RPC parity
        run: |
          pnpm --dir .vitepress/validation/example install --frozen-lockfile
          pnpm --dir .vitepress/validation/example generate
          pnpm --dir .vitepress/validation/example typecheck
          pnpm --dir .vitepress/validation/example test

      - name: Build VitePress
        run: pnpm docs:build

      # The registry is compared with the framework's public packages, so the
      # comparison needs the framework tree. Two details are deliberate: the
      # default branch rather than a release tag, because a package merged in
      # the framework must be documentable before it is released; and the
      # checkout coming after the build, because VitePress builds the project
      # root as its source directory and would otherwise turn the framework
      # README files into pages and fail on their relative links.
      - name: Checkout framework for the registry comparison
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Connectum-Framework/connectum
          ref: main
          path: framework/connectum
          persist-credentials: false
          # The validator reads only packages/<name>/package.json: private flag
          # and name. Cone mode cannot express a file pattern, hence non-cone.
          sparse-checkout: |
            packages/*/package.json
          sparse-checkout-cone-mode: false

      - name: Validate documentation outputs
        env:
          CONNECTUM_FRAMEWORK_ROOT: ${{ github.workspace }}/framework/connectum
        run: pnpm docs:validate:built
