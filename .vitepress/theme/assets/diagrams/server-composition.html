<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compose one Connectum server</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 24px; color: #3c3c43; background: #fff; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    body:has(#server-theme-dark:checked) { color: #dfdfd6; background: #1b1b1f; color-scheme: dark; }
    main { width: 100%; max-width: 688px; min-width: 0; margin: auto; }
    h1 { font-size: 28px; font-weight: 600; }
    label { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; }
    figure { margin: 16px 0; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 688px; }
    figcaption { margin-top: 12px; font-size: 14px; line-height: 1.6; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } label { display: none; } }
  </style>
</head>
<body>
  <main>
    <h1>Compose one Connectum server</h1>
    <label><input type="checkbox" id="server-theme-dark">Dark theme</label>
    <figure>
      <section class="diagram-container" tabindex="0" aria-label="Server composition diagram; scroll horizontally">
        <svg class="server-composition" viewBox="84 0 688 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="server-composition-title server-composition-desc">
        <title id="server-composition-title">Compose one Connectum server</title>
        <desc id="server-composition-desc">createServer provides the server runtime for your typed RPC handlers, with optional interceptors and protocol plugins.</desc>
        <defs>
          <style>
            .server-composition {
              --sc-paper: var(--connectum-diagram-node, #fff);
              --sc-ink: var(--connectum-diagram-text, #3c3c43);
              --sc-muted: var(--connectum-diagram-muted, #67676c);
              --sc-accent: #3153a0;
              --sc-blue-surface: #eaf0ff;
              --sc-blue-border: #6078aa;
              --sc-blue-left: #9aaee2;
              --sc-blue-right: #345bc4;
            }
            .dark .server-composition, body:has(#server-theme-dark:checked) .server-composition {
              --sc-paper: #1b1b1f;
              --sc-ink: #dfdfd6;
              --sc-muted: #a4a4ab;
              --sc-accent: #b9cdff;
              --sc-blue-surface: #202b43;
              --sc-blue-border: #7f9cd4;
              --sc-blue-left: #18223a;
              --sc-blue-right: #111a2d;
            }
            .server-composition .sc-base, .server-composition .sc-top { fill: var(--sc-paper); }
            .server-composition .sc-left { fill: color-mix(in srgb, var(--sc-ink) 7%, var(--sc-paper)); }
            .server-composition .sc-right { fill: color-mix(in srgb, var(--sc-ink) 15%, var(--sc-paper)); }
            .server-composition .sc-outline { fill: none; stroke: var(--sc-ink); stroke-width: 1.2; stroke-linejoin: round; }
            .server-composition .sc-rim { fill: none; stroke: var(--sc-ink); stroke-opacity: .55; stroke-width: .8; }
            .server-composition .sc-trace { stroke: var(--sc-ink); stroke-opacity: .3; stroke-width: .8; stroke-dasharray: 4 3; }
            .server-composition .sc-leader { stroke: var(--sc-ink); stroke-opacity: .4; stroke-width: .8; }
            .server-composition .sc-dot { fill: var(--sc-ink); }
            .server-composition .sc-name { fill: var(--sc-ink); font: 600 16px Inter, ui-sans-serif, system-ui, sans-serif; }
            .server-composition .sc-detail { fill: var(--sc-muted); font: 400 10px ui-monospace, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; letter-spacing: .08em; }
            .dark .server-composition .sc-base, body:has(#server-theme-dark:checked) .sc-base { fill: #202127; }
            .dark .server-composition .sc-top, body:has(#server-theme-dark:checked) .sc-top { fill: color-mix(in srgb, var(--sc-ink) 10%, #202127); }
            .dark .server-composition .sc-left, body:has(#server-theme-dark:checked) .sc-left { fill: #202127; }
            .dark .server-composition .sc-right, body:has(#server-theme-dark:checked) .sc-right { fill: color-mix(in srgb, var(--sc-paper) 45%, #202127); }
            .server-composition [data-focal] .sc-top, .dark .server-composition [data-focal] .sc-top, body:has(#server-theme-dark:checked) [data-focal] .sc-top { fill: var(--sc-blue-surface); }
            .server-composition [data-focal] .sc-left, .dark .server-composition [data-focal] .sc-left, body:has(#server-theme-dark:checked) [data-focal] .sc-left { fill: var(--sc-blue-left); }
            .server-composition [data-focal] .sc-right, .dark .server-composition [data-focal] .sc-right, body:has(#server-theme-dark:checked) [data-focal] .sc-right { fill: var(--sc-blue-right); }
            .server-composition [data-focal] .sc-outline, .server-composition [data-focal] .sc-rim { stroke: var(--sc-blue-border); }
            .server-composition [data-focal] .sc-leader { stroke: var(--sc-accent); }
            .server-composition [data-focal] .sc-dot, .server-composition [data-focal] .sc-detail { fill: var(--sc-accent); }
          </style>
        </defs>
        <g data-exploded data-origin="304 220" data-gap="60">
          <line class="sc-trace" data-role="trace" x1="127.029" y1="292" x2="127.029" y2="152"/>
          <line class="sc-trace" data-role="trace" x1="480.971" y1="292" x2="480.971" y2="152"/>

          <g data-part="runtime" data-name="Server runtime" data-rect="0 0 184 184 12" data-z="0" data-t="20" data-level="0">

            <path class="sc-left" d="M 127.029 292 A 16.971 8.485 0 0 0 132 298 L 292 378 A 16.971 8.485 0 0 0 304 380.485 L 304 400.485 A 16.971 8.485 0 0 1 292 398 L 132 318 A 16.971 8.485 0 0 1 127.029 312 Z"/>
            <path class="sc-right" d="M 304 380.485 A 16.971 8.485 0 0 0 316 378 L 476 298 A 16.971 8.485 0 0 0 480.971 292 L 480.971 312 A 16.971 8.485 0 0 1 476 318 L 316 398 A 16.971 8.485 0 0 1 304 400.485 Z"/>
            <path class="sc-rim" d="M 127.029 292 A 16.971 8.485 0 0 0 132 298 L 292 378 A 16.971 8.485 0 0 0 316 378 L 476 298 A 16.971 8.485 0 0 0 480.971 292"/>
            <path class="sc-outline" d="M 127.029 292 A 16.971 8.485 0 0 1 132 286 L 292 206 A 16.971 8.485 0 0 1 316 206 L 476 286 A 16.971 8.485 0 0 1 480.971 292 L 480.971 312 A 16.971 8.485 0 0 1 476 318 L 316 398 A 16.971 8.485 0 0 1 292 398 L 132 318 A 16.971 8.485 0 0 1 127.029 312 Z"/>
            <g data-role="label">
              <line data-role="leader" class="sc-leader" x1="486.971" y1="302" x2="564" y2="302"/>
              <circle class="sc-dot" cx="480.971" cy="302" r="2"/>
              <text data-role="name" class="sc-name" x="576" y="298">Server runtime</text>
              <text class="sc-detail" x="576" y="318">createServer · start · stop</text>
            </g>
          </g>

          <g data-part="services" data-name="Your services" data-rect="0 0 184 184 12" data-z="80" data-t="20" data-level="1" data-focal>
            <path data-role="silhouette" class="sc-base" d="M 127.029 212 A 16.971 8.485 0 0 1 132 206 L 292 126 A 16.971 8.485 0 0 1 316 126 L 476 206 A 16.971 8.485 0 0 1 480.971 212 L 480.971 232 A 16.971 8.485 0 0 1 476 238 L 316 318 A 16.971 8.485 0 0 1 292 318 L 132 238 A 16.971 8.485 0 0 1 127.029 232 Z"/>
            <path class="sc-top" d="M 127.029 212 A 16.971 8.485 0 0 1 132 206 L 292 126 A 16.971 8.485 0 0 1 316 126 L 476 206 A 16.971 8.485 0 0 1 480.971 212 A 16.971 8.485 0 0 1 476 218 L 316 298 A 16.971 8.485 0 0 1 292 298 L 132 218 A 16.971 8.485 0 0 1 127.029 212 Z"/>
            <path class="sc-left" d="M 127.029 212 A 16.971 8.485 0 0 0 132 218 L 292 298 A 16.971 8.485 0 0 0 304 300.485 L 304 320.485 A 16.971 8.485 0 0 1 292 318 L 132 238 A 16.971 8.485 0 0 1 127.029 232 Z"/>
            <path class="sc-right" d="M 304 300.485 A 16.971 8.485 0 0 0 316 298 L 476 218 A 16.971 8.485 0 0 0 480.971 212 L 480.971 232 A 16.971 8.485 0 0 1 476 238 L 316 318 A 16.971 8.485 0 0 1 304 320.485 Z"/>
            <path class="sc-rim" d="M 127.029 212 A 16.971 8.485 0 0 0 132 218 L 292 298 A 16.971 8.485 0 0 0 316 298 L 476 218 A 16.971 8.485 0 0 0 480.971 212"/>
            <path class="sc-outline" d="M 127.029 212 A 16.971 8.485 0 0 1 132 206 L 292 126 A 16.971 8.485 0 0 1 316 126 L 476 206 A 16.971 8.485 0 0 1 480.971 212 L 480.971 232 A 16.971 8.485 0 0 1 476 238 L 316 318 A 16.971 8.485 0 0 1 292 318 L 132 238 A 16.971 8.485 0 0 1 127.029 232 Z"/>
            <g data-role="label">
              <line data-role="leader" class="sc-leader" x1="486.971" y1="222" x2="564" y2="222"/>
              <circle class="sc-dot" cx="480.971" cy="222" r="2"/>
              <text data-role="name" class="sc-name" x="576" y="218">Your services</text>
              <text class="sc-detail" x="576" y="238">typed RPC handlers</text>
            </g>
          </g>

          <g data-part="extensions" data-name="Optional extensions" data-rect="0 0 184 184 12" data-z="160" data-t="20" data-level="2">
            <path data-role="silhouette" class="sc-base" d="M 127.029 132 A 16.971 8.485 0 0 1 132 126 L 292 46 A 16.971 8.485 0 0 1 316 46 L 476 126 A 16.971 8.485 0 0 1 480.971 132 L 480.971 152 A 16.971 8.485 0 0 1 476 158 L 316 238 A 16.971 8.485 0 0 1 292 238 L 132 158 A 16.971 8.485 0 0 1 127.029 152 Z"/>
            <path class="sc-top" d="M 127.029 132 A 16.971 8.485 0 0 1 132 126 L 292 46 A 16.971 8.485 0 0 1 316 46 L 476 126 A 16.971 8.485 0 0 1 480.971 132 A 16.971 8.485 0 0 1 476 138 L 316 218 A 16.971 8.485 0 0 1 292 218 L 132 138 A 16.971 8.485 0 0 1 127.029 132 Z"/>
            <path class="sc-left" d="M 127.029 132 A 16.971 8.485 0 0 0 132 138 L 292 218 A 16.971 8.485 0 0 0 304 220.485 L 304 240.485 A 16.971 8.485 0 0 1 292 238 L 132 158 A 16.971 8.485 0 0 1 127.029 152 Z"/>
            <path class="sc-right" d="M 304 220.485 A 16.971 8.485 0 0 0 316 218 L 476 138 A 16.971 8.485 0 0 0 480.971 132 L 480.971 152 A 16.971 8.485 0 0 1 476 158 L 316 238 A 16.971 8.485 0 0 1 304 240.485 Z"/>
            <path class="sc-rim" d="M 127.029 132 A 16.971 8.485 0 0 0 132 138 L 292 218 A 16.971 8.485 0 0 0 316 218 L 476 138 A 16.971 8.485 0 0 0 480.971 132"/>
            <path class="sc-outline" d="M 127.029 132 A 16.971 8.485 0 0 1 132 126 L 292 46 A 16.971 8.485 0 0 1 316 46 L 476 126 A 16.971 8.485 0 0 1 480.971 132 L 480.971 152 A 16.971 8.485 0 0 1 476 158 L 316 238 A 16.971 8.485 0 0 1 292 238 L 132 158 A 16.971 8.485 0 0 1 127.029 152 Z"/>
            <g data-role="label">
              <line data-role="leader" class="sc-leader" x1="486.971" y1="142" x2="564" y2="142"/>
              <circle class="sc-dot" cx="480.971" cy="142" r="2"/>
              <text data-role="name" class="sc-name" x="576" y="138">Optional extensions</text>
              <text class="sc-detail" x="576" y="158">interceptors · protocols</text>
            </g>
          </g>
        </g>
      </svg>
      </section>
      <figcaption>The plates show server composition, not RPC execution order. In-process clients can use registered services before a network listener starts.</figcaption>
    </figure>
  </main>
</body>
</html>
