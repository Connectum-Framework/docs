<title id="architecture-title">One process and its extension seams</title>

<figcaption>createServer() owns one process. Catalog, EventBus and OTel are explicit additions; the bus can stay in memory. Protocol HTTP fallbacks sit outside the RPC chain. External infrastructure is selected independently.</figcaption></figure></main></body></html>
