<title id="in-process-title">Local calls retain the application boundary</title>
<desc id="in-process-desc">Local client APIs exchange copied protobuf messages through shared admission and server middleware for all four RPC kinds, with cooperative cancellation and explicit transport, security and telemetry limits.</desc>

<figcaption>Local and HTTP clients can coexist. server.client() selects a local service or configured remoteResolver; local tests do not establish wire, TLS or proxy guarantees. The documented 1.3 stop-abort and parked-yield fixes are not yet published.</figcaption></figure></main></body></html>
