<title id="custom-protocols-title">Custom protocol initialization and routing</title>
<desc id="custom-protocols-desc">A per-server factory separates snapshot-based setup from repeatable router registration, while unmatched HTTP requests pass through explicit handlers to protocol-aware fallback errors.</desc>

.guide-overview-svg .go-heading { font-size: 14px; font-weight: 600; fill: var(--go-ink); }

.guide-overview-svg .go-edge { fill: none; stroke: var(--go-muted); stroke-width: 1.4; }
.guide-overview-svg .go-dashed { stroke-dasharray: 5 4; }
.guide-overview-svg .go-arrow { fill: var(--go-muted); }
.guide-overview-svg .go-label rect { fill: var(--go-paper); }

<g data-node="setup" data-box="24 216 288 112" data-topics="/en/guide/protocols/custom-implementation" data-focal=""><rect class="go-surface" x="24" y="216" width="288" height="112" rx="6"/><text class="go-name" x="40" y="248" text-anchor="start">setup(context)</text><text class="go-detail" x="40" y="268" text-anchor="start">Read snapshot; prepare shared state</text><text class="go-detail" x="40" y="288" text-anchor="start">Once after successful materialization</text><text class="go-detail" x="40" y="308" text-anchor="start">Initial failure can rerun setup</text></g>

<g data-node="http-handler" data-box="248 360 184 96" data-topics="/en/guide/protocols/custom-implementation"><rect class="go-surface" x="248" y="360" width="184" height="96" rx="6"/><text class="go-name" x="264" y="394" text-anchor="start">Unmatched HTTP</text><text class="go-detail" x="264" y="414" text-anchor="start">httpHandler: /metrics</text><text class="go-detail" x="264" y="434" text-anchor="start">true handles; false passes</text></g>
<g data-node="rpc" data-box="472 360 192 96" data-topics="/en/guide/protocols/custom-implementation"><rect class="go-surface" x="472" y="360" width="192" height="96" rx="6"/><text class="go-name" x="488" y="394" text-anchor="start">Matched RPC route</text><text class="go-detail" x="488" y="414" text-anchor="start">ServerInfo endpoint</text><text class="go-detail" x="488" y="434" text-anchor="start">HTTP + local routers</text></g>
<g data-node="fallback" data-box="248 500 416 76" data-topics="/en/guide/protocols/custom-implementation"><rect class="go-surface" x="248" y="500" width="416" height="76" rx="20"/><text class="go-name" x="264" y="524" text-anchor="start">Default fallback</text><text class="go-detail" x="264" y="544" text-anchor="start">Unknown Connect / gRPC / gRPC-Web: unimplemented</text><text class="go-detail" x="264" y="564" text-anchor="start">Other requests: 404 Not Found</text></g>
</svg></section>
<figcaption>Keep setup idempotent because failed initial materialization can retry it. Create a fresh protocol instance per server. Supported RPC content types receive protocol-aware unimplemented errors; other unmatched requests retain 404.</figcaption></figure></main></body></html>
