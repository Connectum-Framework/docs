<title id="health-title">One health registry, multiple protocol views</title>
<desc id="health-desc">Application lifecycle and dependency checks update a shared health registry, whose gRPC and HTTP views supply platform probes without separate status state for HTTP aliases.</desc>

<figcaption>The application owns transitions. /healthz, /health and /readyz report the same aggregate state. Different liveness and readiness semantics require application-owned checks; changing the path name does not create another state.</figcaption></figure></main></body></html>
