<title id="mechanisms-title">Choose the interaction and its recovery owner</title>
<desc id="mechanisms-desc">The interaction goal selects a service call, a stream or an event, while workflows needing durable progress use an external Temporal worker with explicit compensations.</desc>

<figcaption>Calls couple latency and availability; events add delivery and idempotency concerns. Temporal owns durable orchestration outside Connectum. Compensations can fail and do not make service changes atomic.</figcaption></figure></main></body></html>
