<title id="events-title">Publish, consume, recover and drain events</title>
<desc id="events-desc">A typed publication resolves its topic and passes through the chosen adapter to matching consuming middleware and a handler, with dead letters, AMQP recovery and shutdown relay as separate reliability concerns.</desc>

<figcaption>Publishing skips consuming middleware. Local retries re-enter the handler; exhausted failures can produce a DLQ copy, whose publication can also fail. Shutdown relay uses in-flight ctx.publish before the handler returns. Recovery and relay details marked Since 1.3.0 require that release.</figcaption></figure></main></body></html>
