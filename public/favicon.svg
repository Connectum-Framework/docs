<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Connectum">
    <!--
        Source of truth for every favicon on the site. Regenerate the rasters with
        scripts/generate-favicons.mjs after changing this file.

        The mark is drawn rather than typeset. A favicon is rendered in a restricted
        context: external resources are not fetched and CSS animation does not run, so a
        text element in a webfont falls back to whatever sans-serif the operating system
        picks: a different letterform on every platform, and none of them the intended
        one. A stroked arc is self-contained and identical everywhere.

        Geometry: centreline radius 39 with a 22 stroke gives a 100px ring inside the
        128px box, and a 76-degree aperture on the right reads as a C down to 16px.
    -->
    <defs>
        <linearGradient id="connectum-favicon-gradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#635BFF" />
            <stop offset="1" stop-color="#38C2FF" />
        </linearGradient>
    </defs>
    <path
        d="M 94.73 88.01 A 39 39 0 1 1 94.73 39.99"
        fill="none"
        stroke="url(#connectum-favicon-gradient)"
        stroke-width="22"
        stroke-linecap="butt"
    />
</svg>
